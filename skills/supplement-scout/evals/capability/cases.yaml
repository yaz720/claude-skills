# 能力测试:触发后活干得好不好。check 由 LLM 裁判逐条判(可含硬检查)。
# 注:本技能的产出是一份十章调研报告,单次实跑耗时长(第三步要真搜)。
# 逐次产出进 evals/capability/outputs/(gitignore);认可的标准产出才进 golden/。
#
# check 的依据是 SKILL.md 里那 7 项【强制安全审计】—— 它们的优先级明确高于报告完整性
# 与打分排名,所以能力测试也按这个优先级来判:安全审计没做对,报告再漂亮也不算过。
# cap-001/002 分别覆盖 SKILL.md 定义的模式 A(用户给了画像 → 完整叠加审计 + 针对性建议章节)
# 与模式 B(用户跳过 → 通用 UL 与草本提醒);cap-003 专门验草本警戒这条最容易被漏的规则。

- id: cap-001
  input: "帮我调研一下复合维生素(女性,42 岁)。我现在每天吃 2000 IU 维生素 D,每周两次各 5000 IU 的另一瓶 D3,还在吃甲状腺药左甲状腺素。没有在做中医调理。"
  check:
    - "走模式 A:因为用户给了画像(年龄性别 + 在服清单 + 用药),报告生成了「针对性建议」章节,而不是只出通用报告"
    - "完成叠加审计:把每天 2000 IU 与每周两次 5000 IU 折算成日均(≈1429 IU/日)后相加得出现有摄入约 3429 IU/日,再叠加候选产品的 D 含量对照 UL(4000 IU/日)"
    - "任何使叠加总量超过 UL 的候选产品被直接排除或降级,并在报告里写明排除理由,而不是因品牌声誉保留"
    - "对左甲状腺素点出相互作用:钙/铁/镁与甲状腺素需间隔服用(通常 4 小时),这条出现在针对性建议里"
    - "所有候选产品逐个核对了 B6 含量与形态,>20 mg 的配方对长期日常使用者被默认排除,并提及 EFSA 2023 下调后的 UL 12 mg/日"
    - "产品信息卡明确标注 serving size 与每日建议量的关系(写成「每份 = X 片 = 每日量」),没有默认 1 片 = 1 份"
    - "每项产品规格数据标注了来源级别(实物标签照片 > 零售商 Supplement Facts > 品牌官网),无法核实的字段标注「⚠️ 未查到」而不是推测填充"
    - "辅料按三级清单逐项评级(🔴 扣分 / 🟡 中性 / 🟢 常规工艺),给出 X/5 分并点名具体成分;产品信息卡有「Other Ingredients 清单及评级」一行"
    - "候选池经硬性门槛淘汰后剩下的产品有五维度打分表,不是简单罗列品牌"
    - "报告按十章框架组织,且末尾附上了 appendix_certifications.md 的认证机构内容(排在参考文献之前)"
    - "报告用中文撰写,专业术语附英文原文"

- id: cap-002
  input: "鱼油哪个牌子好?"
  check:
    - "先按第一步问诊:至少问了在服补充剂与处方药清单(叠加审计所需),没有跳过直接给推荐"
    - "若用户未提供画像信息,走模式 B:报告标注「未完成叠加审计」,并给出脂溶性维生素与 B6 的通用 UL 上限提醒交由用户自行核对"
    - "针对鱼油特有的核对项:EPA/DHA 实际含量(而非鱼油总量)、酯型 vs 甘油三酯型、氧化值(TOTOX/过氧化值)、重金属与第三方检测"
    - "产品信息卡标注 serving size 与每日量关系,且给出的是每份实际 EPA+DHA 毫克数"
    - "有硬性门槛淘汰的过程说明,候选从十几个收敛到最终推荐,不是直接给三个品牌"
    - "附上认证机构附录(USP / NSF Certified for Sport / IFOS 等在鱼油品类上相关的部分)"

- id: cap-003
  input: "想找个女性复合配方,我正在看中医调月经,在吃中药。"
  check:
    - "草本混合物警戒被触发:因为用户明确在接受中医方剂治疗且有月经健康议题"
    - "含激素活性草本(圣洁莓/vitex、当归、黑升麻、南非醉茄等)的复合配方被排除,或给出「须经治疗医生确认」的强制提示,不是默默推荐"
    - "草本混合物若未标注单味剂量,一律记为不可评估,而不是按品牌声誉给分"
    - "报告没有替中医方剂做加减或给出中药相互作用的确定结论,而是把判断交回治疗医生"
    - "仍然完成了其余固定审计项(B6 筛查、serving size、辅料评级),没有因为这条特殊规则而跳过常规流程"
