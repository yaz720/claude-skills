<svg width="680" height="210" viewBox="0 0 680 210" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
<title>草图清绘:手绘草图 → 清绘后</title>
<desc>把潦草的三步草图整理成对齐、清晰的版本。</desc>
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b6f76"/></marker>
<marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#999999"/></marker>
<marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a90d9"/></marker>
</defs>
<rect x="0" y="0" width="680" height="210" fill="#ffffff"/>

<text x="150" y="28" text-anchor="middle" font-size="12" fill="#999999">手绘草图</text>
<g transform="rotate(-2 150 61)"><rect x="80" y="44" width="140" height="34" rx="3" fill="none" stroke="#999999" stroke-width="1.5"/><text x="150" y="66" text-anchor="middle" font-size="13" fill="#777777">步骤 1</text></g>
<g transform="rotate(1.5 150 116)"><rect x="80" y="99" width="140" height="34" rx="3" fill="none" stroke="#999999" stroke-width="1.5"/><text x="150" y="121" text-anchor="middle" font-size="13" fill="#777777">步骤 2</text></g>
<g transform="rotate(-1 150 171)"><rect x="80" y="154" width="140" height="34" rx="3" fill="none" stroke="#999999" stroke-width="1.5"/><text x="150" y="176" text-anchor="middle" font-size="13" fill="#777777">步骤 3</text></g>
<line x1="150" y1="79" x2="150" y2="97" stroke="#999999" stroke-width="1.5" marker-end="url(#ahg)"/>
<line x1="150" y1="134" x2="150" y2="152" stroke="#999999" stroke-width="1.5" marker-end="url(#ahg)"/>

<text x="336" y="106" text-anchor="middle" font-size="12" fill="#4a90d9">整理</text>
<line x1="300" y1="116" x2="372" y2="116" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#ahb)"/>

<text x="470" y="28" text-anchor="middle" font-size="12" fill="#4a90d9">清绘后</text>
<rect x="400" y="44" width="140" height="34" rx="8" fill="#4a90d9"/><text x="470" y="66" text-anchor="middle" font-size="13" fill="#ffffff">步骤 1</text>
<rect x="400" y="99" width="140" height="34" rx="8" fill="#4a90d9"/><text x="470" y="121" text-anchor="middle" font-size="13" fill="#ffffff">步骤 2</text>
<rect x="400" y="154" width="140" height="34" rx="8" fill="#4a90d9"/><text x="470" y="176" text-anchor="middle" font-size="13" fill="#ffffff">步骤 3</text>
<line x1="470" y1="78" x2="470" y2="97" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah)"/>
<line x1="470" y1="133" x2="470" y2="152" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah)"/>
</svg>
