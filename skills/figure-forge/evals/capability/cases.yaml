# 能力测试:触发后活干得好不好。分两层判,各管各的:
#
#  (1) LLM 裁判(eval_run.py)——只判**文本能验证**的东西:SVG 源码是否完整可存盘、
#      结构/图型/数值是否正确、标签是否可读。**不再让它判"文件是否真存在"**
#      (文本裁判验不了磁盘上有没有文件,会时对时错)。
#  (2) 硬检查(scripts/check_delivery.py)——确定性地验证**文件是否真的产出**:
#      解析 outputs/<id>.txt 末尾的 [files] 行,核对所列 .svg/.png 真实存在、非空、
#      且魔数/根标签正确。这才是"交付真实文件"的权威判据。
#
# 怎么喂产出:本技能用代码画 SVG(SVG 即文本)。把生成的 SVG 源码整段存进
#   outputs/<id>.txt,末尾加一行 [files](列出与 txt 同目录的产物文件名),例如:
#     <svg ...>...</svg>
#     [files] cap-001.svg + cap-001.png
#   并把这两个产物文件也放到 outputs/ 下(本地评测产物,已 gitignore)。
#   认可为标准的产出,复制到 golden/(入库,当"问→答"可视基线);逐次 outputs/ 仍 gitignore。
# 没有 outputs/<id>.txt 时该用例自动跳过(不是失败),补上产出再重跑。
# 覆盖三种输入模式:说明→流程图 / 数据→图表 / 结构→架构图。

- id: cap-001
  input: "帮我画个流程图,把小卖部进货流程理一下:供应商下单 → 收货核对 → 上架 → 每周盘点"
  check:
    - "输出包含完整、可直接存成 .svg 的 SVG 源码(有 <svg> 根与 viewBox,由 rect/line/text 等矢量元素构成),并附 SVG→PNG 转换注记"
    - "流程图包含全部四步(供应商下单、收货核对、上架、每周盘点),且顺序与箭头方向正确"
    - "每个节点有清晰文字标签,步骤之间的连接方向明确(有向)"
    - "是矢量代码绘制而非位图/AI 文生图(源码里是矢量节点与连线)"

- id: cap-002
  input: "我们 Q3 各渠道注册数:organic 1240、paid 890、referral 430、email 210。做张图看哪个渠道带来的最多。"
  check:
    - "输出包含完整、可直接存成 .svg 的 SVG 源码(有 <svg> 根与 viewBox),并附 SVG→PNG 转换注记"
    - "图型选择恰当:类别间数值对比 → 柱状图(而非饼图/折线等不贴切的类型)"
    - "四个渠道的数值编码正确、成比例(organic 最高、email 最低),能一眼看出哪个渠道最多"
    - "坐标轴、类别标签、数值/刻度可读;最高项清晰可辨(排序或视觉强调)"

- id: cap-003
  input: "画一张微服务架构图:前端 → API 网关 → 三个后端服务(用户/订单/支付)→ 各自的数据库"
  check:
    - "输出包含完整、可直接存成 .svg 的 SVG 源码(有 <svg> 根与 viewBox),并附 SVG→PNG 转换注记"
    - "层次正确:前端 → API 网关 → 三个后端服务 → 数据库,自上而下(或左右)分层清晰"
    - "三个服务(用户/订单/支付)各连到自己的数据库,而不是共用一个库"
    - "所有节点有标签、分组分层布局整齐,箭头表达调用方向"
