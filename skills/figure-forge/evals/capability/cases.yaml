# 能力测试:触发后活干得好不好。check 由 LLM 裁判逐条判(见 eval_run.py)。
#
# figure-forge 产出的是文件,而裁判读的是文本产出 evals/capability/outputs/<id>.txt。
# 怎么喂产出:本技能用代码画 SVG,SVG 本身即文本——
#   把生成的 SVG 源码整段存进 outputs/<id>.txt,并在末尾附一行注明 PNG 已产出及其路径,例如:
#     <svg ...>...</svg>
#     [files] diagrams/intake-flow.svg + diagrams/intake-flow.png (rsvg-convert, 3x)
#   裁判据此核对:是否交付真实文件、结构/图型/数值是否正确、标签是否可读。
# 没有 outputs/<id>.txt 时该用例自动跳过(不是失败),补上产出再重跑。
# 覆盖三种输入模式:说明→流程图 / 数据→图表 / 结构→架构图。

- id: cap-001
  input: "帮我画个流程图,把小卖部进货流程理一下:供应商下单 → 收货核对 → 上架 → 每周盘点"
  check:
    - "交付的是真实文件:同时产出 .svg 和 .png,而不是只在对话里贴一张内联图"
    - "流程图包含全部四步(供应商下单、收货核对、上架、每周盘点),且顺序与箭头方向正确"
    - "每个节点有清晰文字标签,步骤之间的连接方向明确(有向)"
    - "用代码/SVG 绘制,不是 AI 文生图(SVG 源码里是矢量节点与连线,而非位图)"

- id: cap-002
  input: "我们 Q3 各渠道注册数:organic 1240、paid 890、referral 430、email 210。做张图看哪个渠道带来的最多。"
  check:
    - "交付真实文件:.svg + .png"
    - "图型选择恰当:类别间数值对比 → 柱状图(而非饼图/折线等不贴切的类型)"
    - "四个渠道的数值编码正确、成比例(organic 最高、email 最低),能一眼看出哪个渠道最多"
    - "坐标轴、类别标签、数值/刻度可读;最高项清晰可辨(排序或视觉强调)"

- id: cap-003
  input: "画一张微服务架构图:前端 → API 网关 → 三个后端服务(用户/订单/支付)→ 各自的数据库"
  check:
    - "交付真实文件:.svg + .png"
    - "层次正确:前端 → API 网关 → 三个后端服务 → 数据库,自上而下(或左右)分层清晰"
    - "三个服务(用户/订单/支付)各连到自己的数据库,而不是共用一个库"
    - "所有节点有标签、分组分层布局整齐,箭头表达调用方向"
