<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
  <rect width="940" height="200" fill="#ffffff"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">小卖部进货流程</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="20"  y="90" width="180" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="132" text-anchor="middle" font-size="18" fill="#1e3a8a">供应商下单</text>

  <rect x="250" y="90" width="180" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="132" text-anchor="middle" font-size="18" fill="#1e3a8a">收货核对</text>

  <rect x="480" y="90" width="180" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="570" y="132" text-anchor="middle" font-size="18" fill="#1e3a8a">上架</text>

  <rect x="710" y="90" width="180" height="72" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="800" y="132" text-anchor="middle" font-size="18" fill="#065f46">每周盘点</text>

  <line x1="200" y1="126" x2="248" y2="126" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="126" x2="478" y2="126" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="126" x2="708" y2="126" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
