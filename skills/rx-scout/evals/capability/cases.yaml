# 能力测试:触发后活干得好不好。check 由 LLM 裁判逐条判(可含硬检查)。
# 注:本技能的产出是一份带联网调研的选药报告,单次实跑耗时长。
# 逐次产出进 evals/capability/outputs/(gitignore);认可的标准产出才进 golden/。
#
# cap-001 是母版案例回归(2026-05 他汀选药对话的画像,已泛化脱敏),验核心场景二(类内选药)
# 的完整引擎:全员盘点、五维对比、族裔加权、三档筛选、剂量与联用、就诊清单、免责。
# cap-002 验场景一(病症选类)的边界:选类做到指南级,允许简短类内速览,但不跑成员级完整引擎。
#
# 规格变更记录 2026-08-25:基线三遍显示模型自发在选类后附成员级速览且质量良好,
# 经用户裁决把"浅做边界"从"完全不展开成员"放宽为"允许简短速览,禁完整引擎与成员级最终推荐",
# SKILL.md 场景一与下面第 4 条检查同步修改;第 6 条"落盘"检查改为裁判可判的内容检查,
# 文件是否真实存在由评测流程用 ls 硬查,不再交给只能看文本的裁判。

- id: cap-001
  input: "帮我调研一下他汀类药物该选哪种。使用者是 55 岁亚裔男性,体检发现冠状动脉有少量斑块,Lp(a) 遗传性偏高,LDL 明显超标,前几年曾接近糖尿病前期后来恢复了。他最在意肝脏和血糖方面的副作用,肌肉症状可以往后排,希望从最低有效剂量吃起,价格不是考虑因素。"
  check:
    - "全员盘点完整:列出全部 7 种 FDA 批准的他汀(洛伐/辛伐/普伐/氟伐/阿托伐/瑞舒伐/匹伐),并提到已撤市的西立伐他汀及撤市原因"
    - "五个对比维度都出现:效力分级(含等效剂量概念)、代谢通路与相互作用(CYP3A4 与否)、半衰期与服药时机(长效/短效)、副作用谱(附真实发生率而非笼统吓唬)、特殊人群证据"
    - "族裔证据加权真实发生并影响结论:提到亚洲人服他汀血药浓度高于白种人,和/或引用东亚人群研究(如 REAL-CAD、PAPAGO-T、台湾健保数据库),而不是只用欧美证据"
    - "三档筛选结构存在(明确排除/有条件考虑/重点候选),每个被排除的药都写了与画像相关的具体理由,候选逐条对照用户诉求(肝脏、血糖、最低剂量)写满足与不满足"
    - "给出最低有效剂量起步的策略,提到剂量翻倍收益边际递减(6% 法则或等价表述),并给出联用预案(如依折麦布)而非一味加量"
    - "报告末尾有就诊讨论问题清单(可直接带去问医生的问题)和免责声明;全文没有『你应该直接改吃 X』式的处方式表述"
    - "报告以中文 Markdown 文件落盘,药名与专业术语首次出现附英文原文,引用编号与参考文献列表对应且附 URL"

- id: cap-002
  input: "我妈 65 岁,刚查出高血压,医生说要开始吃药了。降压药种类那么多,她该吃哪类?帮我调研一下。"
  check:
    - "正确识别为病症选类场景:先做药物类别层的调研,而不是直接跳到某个具体药"
    - "类别全员盘点:覆盖主要降压药类别(ACEI、ARB、CCB、噻嗪类利尿剂,β受体阻滞剂的一线地位争议如实说明),各类特点、适用与不适用人群"
    - "画像匹配:结合 65 岁老年女性的特点(如老年人群 CCB/利尿剂的证据、直立性低血压与跌倒风险、合并症未知时的保守表述)做类别层面的三档筛选或倾向排序"
    - "选类层是报告主体:三档筛选发生在类别层;选定候选类后若附类内内容,仅为简短速览(每个成员一两行、点出定位与显著差异),没有对成员跑完整七步引擎,没有给出成员级的最终用药推荐,并明确说明『下一步可做类内选药』"
    - "有就诊讨论问题清单与免责声明,强调最终由医生结合完整检查决定"
    - "报告以中文撰写、Markdown 结构,专业术语附英文原文(文件存在性由评测流程硬查,不在裁判范围)"
