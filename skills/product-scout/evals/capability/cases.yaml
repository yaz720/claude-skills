    - "对'蓬松/防脱'类卖点做机制审查:说明靠什么实现,无证据宣称被点名为营销"
    - "有'明确不推荐/降级'名单及理由,不只报喜"
    - "官方'宣称'与'公布数值'区别标注(如 pH balanced vs pH 5.0-5.5)"
    - "报告落盘为 Markdown 文件并发给用户"
