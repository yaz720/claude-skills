# 状态:pending——待技能实战产出后跑能力基线(先跑触发基线)。
- id: cap-001
  input: "帮我调研洗发水:细软直发、中性头皮、担心掉头发,想要温和但洗得干净的"
  check:
    - "推荐依据不含任何商业媒体榜单(Wirecutter/NBC Select/Forbes 类只可出现在候选池说明中)"
    - "每个推荐产品给出完整成分表并逐项核验,注明数据库来源(INCIDecoder/EWG 等链接)"
