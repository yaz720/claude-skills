# 触发测试:正例该触发(fire)、负例不该触发(no-fire)。
# 覆盖 nutri-check 宣称的四种输入通道(标签照片/文字配料/只给名称/成品菜照片)与"要一份可保存报告"的诉求。
# 负例重点是相邻技能护栏 —— 尤其 supplement-scout(补剂)、food-research(食材品牌产地)、
# care-scout(找人)、second-opinion-panel(析病)、figure-forge(画图) 与本技能(算某份具体食物)的分界。

# ---------- 正例:该触发 ----------
- { id: trig-001, input: "我做了一批桃酥饼干,低筋面粉130g、植物油65g、糖20g、蛋黄20g,分8个,帮我算算营养", expect: fire }
- { id: trig-002, input: "这道菜有多少热量?", expect: fire }
- { id: trig-003, input: "帮我分析这个食谱", expect: fire }
- { id: trig-004, input: "这个面包大概多少卡", expect: fire }                                   # 极短、随口问
- { id: trig-005, input: "甜樱桃 100g 的营养成分是什么样的", expect: fire }                        # 单一食材形态
- { id: trig-006, input: "(附营养标签照片)这三包东西加起来一共多少蛋白质和糖?", expect: fire }        # 方式 A
- { id: trig-007, input: "(附一张做好的番茄炒蛋照片)这盘大概多少热量?", expect: fire }               # 方式 D 视觉估算
- { id: trig-008, input: "2 cups all-purpose flour, 1/2 cup sugar, 3 eggs, 100g butter — nutrition facts for the whole batch?", expect: fire }
- { id: trig-009, input: "帮我把这个配方做成 FDA 那种营养成分标签,最好能存成 PDF", expect: fire }      # 明确要交付物
- { id: trig-010, input: "black sesame paste with pecans and walnuts, can you give me the macro breakdown per serving?", expect: fire }
- { id: trig-011, input: "我这锅红烧肉的糖分构成能拆开看吗,果糖葡萄糖各多少", expect: fire }            # 糖分拆解
- { id: trig-012, input: "核桃是可选的,加和不加两种情况的热量差多少?", expect: fire }                  # 可选原料对照
- { id: trig-013, input: "How many calories in the pasta I made — 200g dry spaghetti, 2 tbsp olive oil, 150g ground beef?", expect: fire }
- { id: trig-014, input: "这一周的便当配料我列给你,帮我算算每盒的宏量营养素", expect: fire }

# ---------- 负例:不该触发 ----------
# (a) 相邻技能的活
- { id: trig-neg-001, input: "鱼油补充剂哪个牌子好?想了解一下剂型和吸收率", expect: no-fire }           # → supplement-scout
- { id: trig-neg-002, input: "草饲牛肉和谷饲牛肉有什么区别,买哪个好?", expect: no-fire }               # → food-research
- { id: trig-neg-003, input: "湾区哪里能找到靠谱的注册营养师,接受 PPO 的", expect: no-fire }           # → care-scout
- { id: trig-neg-004, input: "我查出脂肪肝,几个医生说法不一样,想听听多方观点", expect: no-fire }        # → second-opinion-panel
- { id: trig-neg-005, input: "帮我画一张三大营养素代谢通路的示意图", expect: no-fire }                 # → figure-forge
- { id: trig-neg-006, input: "把这份体检报告里的人名和医院脱敏后再存档", expect: no-fire }             # → redact
# (b) 纯营养学知识问答 —— 没有具体某一份食物要算
- { id: trig-neg-007, input: "膳食纤维对肠道菌群的作用机理是什么?", expect: no-fire }
- { id: trig-neg-008, input: "添加糖和天然糖在代谢上有区别吗?", expect: no-fire }
- { id: trig-neg-009, input: "FDA 的 %Daily Value 是按多少千卡算的?", expect: no-fire }               # 只问标准,不算食物
# (c) 沾"食物/热量"边但诉求不是算营养
- { id: trig-neg-010, input: "帮我制定一个一周减脂食谱", expect: no-fire }                            # 要的是配餐计划,不是成分核算
- { id: trig-neg-011, input: "楼下那家餐厅好吃吗?", expect: no-fire }
- { id: trig-neg-012, input: "帮我读一下这张体检报告的血糖和血脂指标", expect: no-fire }                # 解读化验单,不是算食物
