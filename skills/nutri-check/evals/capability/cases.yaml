# 能力测试:触发后活干得好不好。check 由 LLM 裁判逐条判(可含硬检查)。
# 注:能力用例需真实产出 JSX/PDF,耗时较长;初始集,后续用 harvest.sh 并入线上翻车案例。
# 逐次产出进 evals/capability/outputs/(gitignore);认可的标准产出才进 golden/。

# ⚠️ 改规格记录(不是调优偷改靶子):2026-08-22 第二轮,用户对首版产出提出七点反馈,
# SKILL.md 的 Step 5/6/7 与关键原则据此修订(标签前置、徽章去 emoji 且带双热量、
# 同源来源合并脚注、新增营养亮点卡、糖分卡三档、不提无出处的"原方")。
# cap-001 的 check 随规格同步更新;首版旧 check 已被取代,旧分数留在 RESULTS.md 里可回看。
- id: cap-001
  input: "中式桃酥饼干,低筋面粉130g、植物油65g、糖20g、盐1g、蛋黄20g、泡打粉5g,熟核桃仁碎25g(可选),蛋黄液刷面~10g,芝麻装饰~5g。170°C 烤 18-22 分钟,分 8 个。做法:油和糖拌匀→加蛋黄和盐→筛入粉类翻拌成团→(可选)加核桃碎→分8份压扁→刷蛋黄液撒芝麻→烤。帮我算营养,要能打印的报告。"
  check:
    - "五段式齐全:食谱信息、原料清单、制作步骤、FDA 标签、各原料营养贡献明细表(因为用户给了完整食谱含步骤)"
    - "顺序正确:FDA 标签(第 4 部分)排在各原料营养贡献明细表(第 5 部分)之前,结论在前过程在后"
    - "顶部徽章为纯文字不挂 emoji(份数写成「共 8 个」而不是「🔢 8 个」),且同时给出每份热量与整批热量两个数"
    - "核桃被识别为可选原料并用醒目标签标注,且给出'不含核桃'与'含核桃'两版的合计与每份数值"
    - "顶部有主题 Emoji(烘焙类,如 🍪)+ 金黄系柔和渐变背景,标题用同色系深色;除顶部主题位外报告其余处不滥挂 emoji"
    - "FDA 标签正文保持英文(Nutrition Facts / % Daily Value / Total Fat 等未被译成中文)"
    - "数据来源同源合并:九种原料全部无标签、全走 USDA 估算,因此明细表没有逐行重复的'来源'列,而是在表下用一句脚注说明全部为 USDA 估算"
    - "出了营养亮点卡(5A);因为桃酥没有 %DV ≥20% 的微量营养素,如实写明'无突出微量营养素'而不是硬凑几条"
    - "糖分构成走'一句话'档而非画三条进度条:因为蔗糖占总糖 ≥90%(实为 100%),收成一行结论说明总糖克数、蔗糖占比、全部为添加糖"
    - "食谱信息里没有出现无出处的'原方/原配方'字样;减糖只用常识性描述或本方事实陈述"
    - "产出真的 PDF 文件,US Letter 尺寸(8.5×11in),由 Playwright/Chromium 渲染而非 reportlab 画坐标"
    - "PDF 中没有任何单个表格或 FDA 标签被跨页截断"

- id: cap-002
  input: "甜樱桃 100g 的营养成分"
  check:
    - "走单一食材形态:只出主题头 + FDA 标签 + 糖分构成卡片,没有生造'只有一行'的原料清单板块或空的制作步骤板块"
    - "主题选中 🍒 与红色系暖粉渐变(#fdf6f0→#fce4ec→#fff3e0),标题深色为 #b71c1c 一类同色系深红"
    - "糖分构成卡片列出果糖/葡萄糖/蔗糖的克数,并且把各自占总糖的百分比数字写出来(不只是进度条长度)"
    - "进度条以总糖为 100% 基准,三种糖用同色系深浅区分"
    - "标注数据来源为 USDA FoodData Central"

- id: cap-003
  input: "(用户上传一张做好的宫保鸡丁照片,只说)这盘大概多少热量?"
  check:
    - "先识别菜品并列出推断的原料与用量清单,请用户确认或修正后再计算,而不是直接给出一个数字"
    - "整个结果明确标注为 ⚠️ 视觉估算,并说明实际值可能有较大偏差、知道具体用料可以更准"
    - "视觉估算引用了尺寸锚点(如餐盘直径、手掌大小对应克数)而非凭空给量"
    - "仍然输出 FDA 标签,但估算项带 † 标注"

- id: cap-004
  input: "面粉 300g,黄油 100g,糖 50g,鸡蛋 3 个,分 6 份。算一下每份营养。"
  check:
    - "出 1、2、4、5 四段(有原料无做法),第 3 部分制作步骤被省略且后续编号顺延,没有留空板块"
    - "鸡蛋按 1 个大号鸡蛋 ≈ 50g 换算,黄油/面粉等单位统一到克"
    - "对话内同时给了文字版原料明细表,含合计行与每份行"
    - "没有把 FDA 标签的项目名译成中文"
