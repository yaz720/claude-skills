# form-forge 能力测试：触发之后活干得好不好
# 裁判逐条判。重点验三样：结构规格有没有守住、代偿表有没有真答完三问、
# 条件性区块（安全块）有没有按动作类型正确取舍。

- id: cap-001
  input: "帮我给「臀桥 Glute Bridge」建一张动作卡，卡放 训练/动作库/，图放 训练/动作库/_图/"
  check:
    - "一句话用 > [!abstract] 提示块，且位于 H1 标题之后、其它小节之前"
    - "上半张顺序是：一句话 → 跳转行 → 动作示范 → 练到哪些肌肉 → 通用常见错误与代偿 → 变式提醒 → 相关动作"
    - "徒手无负重动作，**不应该**出现 [!danger] 安全块"
    - "保留了主动肌/协同肌/稳定肌三个词的解释段落，没有假定读者已懂"
    - "代偿表是五列：错误现象 / 谁在代偿 / 你会感觉到 / 说明哪块偷懒 / 怎么改，且中间三列都有实质内容，不是空着或写「无」"
    - "frontmatter 含 部位、训练性质、主肌群、练习者，且 tags 打了 部位/ 性质/ 肌群/ 三个轴"
    - "变式提醒里写明以用户自己教练的做法为准"
    - "文件名是「中文名 English Name.md」双语格式，aliases 列出了多个常见叫法"

- id: cap-002
  input: "帮我给「杠铃卧推 Barbell Bench Press」建一张动作卡"
  check:
    - "因为是有重量、有被压住风险的动作，出现了 [!danger] 安全块，且位于动作示范**之前**"
    - "安全块里写清了做不动时怎么脱身（保护杠/卸片/找人保护），不是泛泛说「注意安全」"
    - "动作示范分成了「器械设置」和「动作本身」两段"
    - "代偿表里的条目是卧推特有的（如挺腰起桥、肩前引、手腕后折），不是从别的动作照抄的通用话"
    - "训练性质标了 力量 或 肌肥大，不是 矫正 或 柔韧性"

- id: cap-003
  input: "我要给动作卡配一张「腘肌 Popliteus」的解剖图，这块肌肉对照表里没有"
  check:
    - "使用了 scripts/fetch_muscle_images.py 或等价的 Commons API 调用，而不是随便找一张网图"
    - "下载前列出候选并说明为什么选这一张（授权、作者、清晰度）"
    - "记录了署名四项：本地文件名 / 原始文件名 / 作者 / 授权"
    - "提到要做目视验收（contact sheet 或逐张看），而不是抓完就用"
    - "提出把这块肌肉补进 assets/muscles.tsv 或用户的肌肉名称对照表"

- id: cap-004
  input: "教练今天说我做臀桥的时候腰塌下去了，说是屁股没使上劲。记一下。"
  check:
    - "定位到臀桥那张卡的「各人记录」里对应那个人的分区，而不是写进上半张的客观知识区"
    - "按今天的绝对日期新增一条，最新在上，包含 问题 + 教练原话 + 改法 三样"
    - "如果这个毛病之前已经出现过，主动提议提炼进该人的自查清单"
    - "没有把这次训练的组数次数记成流水账"
    - "卡不存在时先建卡再记，而不是报错退出"

# 来源：2026-08-22 实战翻车回收。建山羊挺身卡时要配多裂肌图，
# 连栽三次：种加词撞车、种属正则自伤双词名、限流被静默吞成"没有结果"。
- id: cap-005
  input: "给动作卡配一张「多裂肌 Multifidus」的解剖图，这块对照表里没有"
  check:
    - "没有把海百合 Comaster multifidus、海参 Astichopus multifidus、毛茛 Ranunculus multifidus 之类的生态照片当成肌肉图"
    - "换了拼法重试（Multifidus muscle / Musculus multifidus）并查了分类目录，而不是一次搜空就下结论"
    - "最终如实告诉用户「维基共享资源上找不到干净授权的图」，并说明查过哪些路径，而不是硬塞一张不相干的图"
    - "在动作卡里保留多裂肌的文字说明并注明暂无配图，没有因为没图就把这块肌肉整个省掉"
    - "如果查询过程中出现接口错误，明确区分「搜到了但没有」和「压根没搜成（限流）」，不把后者报成前者"

# 来源：2026-08-22 用户提问。技能原先只说"变式提醒里写清差别"，
# 没给判据说什么时候该拆成两张卡，属规格补完。
- id: cap-006
  input: "山羊挺身有髋铰链版和脊柱屈伸版两种练法，练的肌肉不一样。这该做成一张卡还是两张？"
  check:
    - "给出的判据是 frontmatter 会不会打架（主动肌 / 训练性质 / 肌群标签是否改变），而不是笼统的「差别大不大」"
    - "点明 frontmatter 是单值的，硬塞两版会让一半信息出错，且标签检索会返回误导性结果"
    - "结论是这一例该拆（主动肌从臀腿换成竖脊肌）"
    - "同时说明不该拆的反例，如深蹲高杠低杠、45°罗马椅与GHD，因为主动肌没变"
    - "提出拆的时候变式卡只写差异、共享内容双链回主卡，不重复誊写"
    - "提出没人练的那一版不要预先拆，先留在变式提醒里；且拆卡前先问用户"

# 来源：2026-08-22 实战。第三张卡是拉伸/活动度类（侧卧胸椎旋转），
# 暴露出模板原先只按力量动作设计：分工表缺「被拉长」、强度表硬套重量。
- id: cap-007
  input: "帮我给「侧卧胸椎旋转 Side-Lying Thoracic Rotation」建一张动作卡，这是教练给的热身拉伸"
  check:
    - "分工表最上面有一行「被拉长 Lengthened」，列出胸大肌、背阔肌、腹外斜肌、前锯肌一类被这个动作拉开的肌肉"
    - "明确说明拉伸类要分两问：谁被拉长、谁主动发力，且指出被拉长那几块的紧张程度才是决定做得开不开的变量"
    - "训练性质标的是 活动度 和/或 柔韧性，不是力量或肌肥大"
    - "徒手地面动作，**不应该**出现 [!danger] 安全块"
    - "「当前强度」表头没有硬套重量，而是改成活动范围类的表头（保持时间、能到什么位置、两边差别）"
    - "代偿表里点出了这个动作最典型的自欺：骨盆跟着翻，让人误以为自己转得开"
    - "自绘发力图用紫色表示被拉长的肌肉，并在图注里说明这一档"

# 来源：2026-08-22 用户反馈。四张卡的呼吸写法不一致（有的进步骤、
# 有的只在代偿表提一句、有的写「全程正常呼吸」），且卧姿动作漏了头颈支撑。
- id: cap-008
  input: "帮我给「侧卧胸椎旋转」建卡。补充一下：我侧躺时头够不到垫子，肩膀把头顶起来了，转的时候脖子一直绷着，这是不是做错了？"
  check:
    - "明确回答这不是做错，而是摆位缺支撑：肩膀有厚度会把头架空，属于器械/摆位问题不是柔韧性问题"
    - "给出具体解决办法（头下垫枕头/瑜伽砖/毛巾）和判断垫多高的标准（颈椎与胸椎成一条直线）"
    - "说明为什么必须解决：颈部肌肉全程绷着会抵消这个动作的目的，且颈椎侧屈下旋转会跑到颈椎去"
    - "把这条写进卡的客观区（摆位步骤 + 代偿表一行），而不是只当成这个人的个人问题"
    - "动作步骤里写清了哪一相吸气哪一相呼气，并单独给出呼吸节奏的收口提示"
    - "对活动度类动作，点明呼气末是可以多要一点范围的时机"
    - "没有把这当成伤病来诊断；若垫好仍不适，建议让教练看一眼"

# 来源：2026-08-22 用户看了教练示范视频后的追问。
- id: cap-009
  input: "我侧卧胸椎旋转要在头下垫枕头，但教练示范视频里他肩膀也很宽却不用垫，直接就做。我是不是不该垫？"
  check:
    - "解释机制差别而不是让用户向教练看齐：转得开的人末端躯干接近仰卧、头自然落到垫上，转不开的人头全程悬空"
    - "明确肯定用户应该继续垫，并说明硬撑会把旋转赶到颈椎去"
    - "把辅助器材的用量重新定位成可量化的进步刻度（垫高会随活动度提升而降低），而不是能力不足的证据"
    - "提出把垫高记进活动范围表单独一列，以便日后对比"
    - "提醒不要为了压低这个数字而硬撑，否则代偿回来、刻度失真"

# 来源：2026-08-22 用户报动作时用了「激活」这个词，暴露出训练性质九类里没有它。
- id: cap-010
  input: "教练给了个俯卧髋关节内外旋，说是激活用的，两边各 10 次。帮我建卡。"
  check:
    - "训练性质标了 激活（以及活动度之类），没有硬塞进 控制 或 矫正"
    - "说明激活与控制的区别：控制强调轨迹走得对，激活强调让特定那块先有感觉"
    - "点出激活类的自查信号与力量类相反：做完什么感觉都没有多半是白做了，不是太轻松"
    - "代偿表里有「靠惯性甩」这一条，并指出激活类动作快了等于没做"
    - "徒手地面动作，不应该出现 danger 安全块"
    - "对用户提到的两个次数（8 与 10）没有擅自二选一，而是记下教练给的那个并把疑问列进待确认"
