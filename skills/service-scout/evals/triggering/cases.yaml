- { id: trig-012, input: "下周出差一周,想找个靠谱的猫寄养,怎么挑?", expect: fire }
- { id: trig-013, input: "这家驾校 Google 4.8 但 Yelp 才 3.2,到底靠不靠谱?", expect: fire }   # 评价交叉解读也是本技能的活

# ---------- 负例:不该触发 ----------
# (a) 相邻技能的活
- { id: trig-neg-001, input: "想找个有康复背景的普拉提教练帮我练核心", expect: no-fire }        # → care-scout(医疗侧教练)
- { id: trig-neg-002, input: "帮我找个会中文的牙医,要接受我的 PPO", expect: no-fire }           # → care-scout
