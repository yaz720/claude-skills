# 触发测试:正例该触发(fire)、负例不该触发(no-fire)。
# 覆盖 description 宣称的行业面(驾校/教学/搬家/修车/装修/保洁/摄影/宠物/报税)
# 及"解读某家店评价"的隐含场景。负例放相邻技能护栏(care-scout/product-research)
# + 纯知识问答 + 餐厅推荐。出处:建库手写(2026-08-29)。

# ---------- 正例:该触发(要找某类本地服务商/服务者)----------
- { id: trig-001, input: "我想在湾区找个中文驾校学车,帮我看看哪家好", expect: fire }
- { id: trig-002, input: "looking for a driving school near San Jose for my 16 year old, which ones are actually good?", expect: fire }
- { id: trig-003, input: "我下个月要考驾照了,还没摸过车,想找人教我开车", expect: fire }      # 未明说"驾校",暗示找教练
