- { id: trig-006, input: "月底从 Sunnyvale 搬到 Fremont,两室一厅,推荐几家靠谱搬家公司", expect: fire }
- { id: trig-007, input: "车的 check engine 灯亮了,dealer 报价太贵,帮我找家靠谱的修车行", expect: fire }
- { id: trig-008, input: "厨房想重新装修,怎么找靠谱的 contractor?我在 Cupertino", expect: fire }
- { id: trig-009, input: "want to find a house cleaning service that's bonded and insured near Bellevue", expect: fire }
